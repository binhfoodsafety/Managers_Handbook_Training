<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 65 1000 270" role="img" aria-label="Sơ đồ bốn bước"><rect y="65" width="1000" height="270" rx="28" fill="#f7f8fc"/><rect x="35" y="65" width="202" height="220" rx="24" fill="#fff" stroke="#15803d" stroke-width="3"/><circle cx="136" cy="111" r="23" fill="#15803d"/><text x="136" y="119" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="20" fill="#fff">1</text><text x="136" y="171" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="19" fill="#152536">Mở rộng</text><text x="136" y="210" text-anchor="middle" font-family="Arial" font-size="14" fill="#526171">Đưa ra nhiều góc nhìn</text><path d="M245 177h24m-9-9 9 9-9 9" fill="none" stroke="#8c98aa" stroke-width="4"/><rect x="278" y="65" width="202" height="220" rx="24" fill="#fff" stroke="#0f766e" stroke-width="3"/><circle cx="379" cy="111" r="23" fill="#0f766e"/><text x="379" y="119" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="20" fill="#fff">2</text><text x="379" y="171" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="19" fill="#152536">Kết nối</text><text x="379" y="210" text-anchor="middle" font-family="Arial" font-size="14" fill="#526171">Nhóm ý tưởng theo vấn</text><text x="379" y="232" text-anchor="middle" font-family="Arial" font-size="14" fill="#526171">đề</text><path d="M488 177h24m-9-9 9 9-9 9" fill="none" stroke="#8c98aa" stroke-width="4"/><rect x="521" y="65" width="202" height="220" rx="24" fill="#fff" stroke="#e28b35" stroke-width="3"/><circle cx="622" cy="111" r="23" fill="#e28b35"/><text x="622" y="119" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="20" fill="#fff">3</text><text x="622" y="171" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="19" fill="#152536">Chọn</text><text x="622" y="210" text-anchor="middle" font-family="Arial" font-size="14" fill="#526171">So với nhu cầu, ràng</text><text x="622" y="232" text-anchor="middle" font-family="Arial" font-size="14" fill="#526171">buộc</text><path d="M731 177h24m-9-9 9 9-9 9" fill="none" stroke="#8c98aa" stroke-width="4"/><rect x="764" y="65" width="202" height="220" rx="24" fill="#fff" stroke="#6655c7" stroke-width="3"/><circle cx="865" cy="111" r="23" fill="#6655c7"/><text x="865" y="119" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="20" fill="#fff">4</text><text x="865" y="171" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="19" fill="#152536">Thử nhỏ</text><text x="865" y="210" text-anchor="middle" font-family="Arial" font-size="14" fill="#526171">Quan sát, học, điều</text><text x="865" y="232" text-anchor="middle" font-family="Arial" font-size="14" fill="#526171">chỉnh</text><text x="500" y="334" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#687789">QUAN SÁT · TRAO ĐỔI · THỰC HÀNH · ĐIỀU CHỈNH</text></svg>