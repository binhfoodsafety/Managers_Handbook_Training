<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 65 1000 270" role="img" aria-label="Sơ đồ bốn bước"><rect y="65" width="1000" height="270" rx="28" fill="#f7f8fc"/><rect x="35" y="65" width="202" height="220" rx="24" fill="#fff" stroke="#c2410c" stroke-width="3"/><circle cx="136" cy="111" r="23" fill="#c2410c"/><text x="136" y="119" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="20" fill="#fff">1</text><text x="136" y="171" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="19" fill="#152536">Mục đích</text><text x="136" y="210" text-anchor="middle" font-family="Arial" font-size="14" fill="#526171">Muốn người nghe hiểu</text><text x="136" y="232" text-anchor="middle" font-family="Arial" font-size="14" fill="#526171">hay quyết?</text><path d="M245 177h24m-9-9 9 9-9 9" fill="none" stroke="#8c98aa" stroke-width="4"/><rect x="278" y="65" width="202" height="220" rx="24" fill="#fff" stroke="#0f766e" stroke-width="3"/><circle cx="379" cy="111" r="23" fill="#0f766e"/><text x="379" y="119" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="20" fill="#fff">2</text><text x="379" y="171" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="19" fill="#152536">Thông điệp</text><text x="379" y="210" text-anchor="middle" font-family="Arial" font-size="14" fill="#526171">Kết luận, bối cảnh,</text><text x="379" y="232" text-anchor="middle" font-family="Arial" font-size="14" fill="#526171">yêu cầu</text><path d="M488 177h24m-9-9 9 9-9 9" fill="none" stroke="#8c98aa" stroke-width="4"/><rect x="521" y="65" width="202" height="220" rx="24" fill="#fff" stroke="#e28b35" stroke-width="3"/><circle cx="622" cy="111" r="23" fill="#e28b35"/><text x="622" y="119" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="20" fill="#fff">3</text><text x="622" y="171" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="19" fill="#152536">Xác nhận</text><text x="622" y="210" text-anchor="middle" font-family="Arial" font-size="14" fill="#526171">Nghe lại cách hiểu,</text><text x="622" y="232" text-anchor="middle" font-family="Arial" font-size="14" fill="#526171">câu hỏi</text><path d="M731 177h24m-9-9 9 9-9 9" fill="none" stroke="#8c98aa" stroke-width="4"/><rect x="764" y="65" width="202" height="220" rx="24" fill="#fff" stroke="#6655c7" stroke-width="3"/><circle cx="865" cy="111" r="23" fill="#6655c7"/><text x="865" y="119" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="20" fill="#fff">4</text><text x="865" y="171" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="19" fill="#152536">Theo dõi</text><text x="865" y="210" text-anchor="middle" font-family="Arial" font-size="14" fill="#526171">Người làm, hạn, bước</text><text x="865" y="232" text-anchor="middle" font-family="Arial" font-size="14" fill="#526171">tiếp</text><text x="500" y="334" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#687789">QUAN SÁT · TRAO ĐỔI · THỰC HÀNH · ĐIỀU CHỈNH</text></svg>